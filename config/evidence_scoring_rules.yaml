# ─────────────────────────────────────────────────────────
# CONTRACT TERM NOTICE PERIOD SCORING
# ─────────────────────────────────────────────────────────
notice_period_rules:
  EMPLOYER:
    contract_indefinite:
      boost: { doc_id: VBHN_18_2026, article: 36, point: "a", score: 5.5 }
      suppress: { doc_id: VBHN_18_2026, article: 35, penalty: -4.0 }
    contract_definite_12_36_months:
      boost: { doc_id: VBHN_18_2026, article: 36, point: "b", score: 5.5 }
      suppress: { doc_id: VBHN_18_2026, article: 35, penalty: -4.0 }
    contract_under_12_months:
      boost: { doc_id: VBHN_18_2026, article: 36, point: "c", score: 5.5 }
      suppress: { doc_id: VBHN_18_2026, article: 35, penalty: -4.0 }
  EMPLOYEE:
    contract_definite_12_36_months:
      boost: { doc_id: VBHN_18_2026, article: 35, point: "b", score: 5.5 }
      suppress: { doc_id: VBHN_18_2026, article: 36, penalty: -3.0 }
    contract_indefinite:
      boost: { doc_id: VBHN_18_2026, article: 35, point: "a", score: 5.5 }
      suppress: { doc_id: VBHN_18_2026, article: 36, penalty: -3.0 }
    contract_under_12_months:
      boost: { doc_id: VBHN_18_2026, article: 35, point: "c", score: 5.5 }
      suppress_sibling: { doc_id: VBHN_18_2026, article: 35, points: ["a", "b"], penalty: -3.0 }
      suppress_other: { doc_id: VBHN_18_2026, article: 36, penalty: -3.0 }

# ─────────────────────────────────────────────────────────
# DE FACTO EMPLOYMENT SCORING
# ─────────────────────────────────────────────────────────
de_facto_employment_rules:
  article_rules:
    - { doc_id: VBHN_18_2026, article: 13, clause: 1, boost: 8.5 }
    - { doc_id: VBHN_18_2026, article: 90, boost: 4.5 }
    - { doc_id: VBHN_18_2026, articles: [115, 112, 105], penalty: -6.0 }

# ─────────────────────────────────────────────────────────
# SIGNAL WEIGHTS
# ─────────────────────────────────────────────────────────
signal_weights:
  semantic: 1.0
  lexical: 1.0
  topic: 1.5
  actor: 1.5
  intent: 2.0
  qualifier: 2.5
  numeric: 3.0
  specificity: 1.0

# ─────────────────────────────────────────────────────────
# THRESHOLDS
# ─────────────────────────────────────────────────────────
thresholds:
  min_confidence: 0.5
  min_margin: 0.1
  sibling_winner_bonus: 1.0
