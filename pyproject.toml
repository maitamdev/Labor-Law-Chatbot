[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietlabor-ai"
version = "0.1.0"
description = "Local evidence-grounded assistant for Vietnamese labor law"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "requests>=2.31.0,<3",
  "pymupdf>=1.24.0,<2",
  "pydantic>=2.0.0,<3",
  "langchain-core>=1.0.0,<2",
  "langchain-ollama>=1.0.0,<2",
  "chromadb>=0.4.0,<2",
  "sentence-transformers>=3.0.0,<7",
  "bm25s>=0.1.10,<0.4",
  "pyvi>=0.1.1,<0.2",
  "underthesea>=6.0.0,<10",
  "streamlit>=1.35.0,<2",
  "torch>=2.0.0,<3",
  "beautifulsoup4>=4.12.0,<5",
  "PyYAML>=6.0.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<10",
  "pytest-cov>=5.0.0,<8",
  "pyright>=1.1.390",
  "ruff>=0.9.0",
]
evaluation = ["deepeval>=1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires local indexes or other runtime services",
  "ollama: requires a running local Ollama daemon and configured model",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["app", "config", "ingestion", "models", "rag", "ui"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
