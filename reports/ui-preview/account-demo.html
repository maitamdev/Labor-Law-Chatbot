d\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M14 3v4a1 1 0 0 0 1 1h4\" />\n  <path d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\" />\n  <path d=\"M9 17h6\" />\n  <path d=\"M9 13h6\" />\n<\/svg>\n<\/span><span><strong>Bộ luật Lao động 2019 (VBHN 18/VBHN-VPQH)<\/strong><small>Văn bản gốc quy định toàn diện quan hệ lao động, hợp đồng, tiền lương, thời giờ làm việc và kỷ luật<\/small><\/span><\/a><a class=\"document-row\" href=\"https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-145-2020-nd-cp-32732.htm\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"document-icon\"><!--\ntags: [description, document, text, details, notes, article, content, report, page, lines, file]\ncategory: Document\nversion: \"1.55\"\nunicode: \"f028\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M14 3v4a1 1 0 0 0 1 1h4\" />\n  <path d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\" />\n  <path d=\"M9 17h6\" />\n  <path d=\"M9 13h6\" />\n<\/svg>\n<\/span><span><strong>Nghị định 145/2020/NĐ-CP<\/strong><small>Quy định chi tiết và hướng dẫn thi hành Bộ luật Lao động về điều kiện lao động và quan hệ lao động<\/small><\/span><\/a><a class=\"document-row\" href=\"https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-283-2026-nd-cp-470103.htm\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"document-icon\"><!--\ntags: [description, document, text, details, notes, article, content, report, page, lines, file]\ncategory: Document\nversion: \"1.55\"\nunicode: \"f028\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M14 3v4a1 1 0 0 0 1 1h4\" />\n  <path d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\" />\n  <path d=\"M9 17h6\" />\n  <path d=\"M9 13h6\" />\n<\/svg>\n<\/span><span><strong>Nghị định 283/2026/NĐ-CP<\/strong><small>Xử phạt vi phạm hành chính lĩnh vực lao động, BHXH và NLĐ đi làm việc ở nước ngoài (thay thế NĐ 12/2022)<\/small><\/span><\/a><a class=\"document-row\" href=\"https://congbao.chinhphu.vn/van-ban/thong-tu-so-10-2020-tt-bldtbxh-32709.htm\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"document-icon\"><!--\ntags: [description, document, text, details, notes, article, content, report, page, lines, file]\ncategory: Document\nversion: \"1.55\"\nunicode: \"f028\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M14 3v4a1 1 0 0 0 1 1h4\" />\n  <path d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\" />\n  <path d=\"M9 17h6\" />\n  <path d=\"M9 13h6\" />\n<\/svg>\n<\/span><span><strong>Thông tư 10/2020/TT-BLĐTBXH<\/strong><small>Hướng dẫn thi hành nội dung hợp đồng lao động, phụ cấp lương, tiền thưởng và hội đồng thương lượng<\/small><\/span><\/a><a class=\"document-row\" href=\"https://congbao.chinhphu.vn/van-ban/nghi-dinh-so-38-2022-nd-cp-35805.htm\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"document-icon\"><!--\ntags: [description, document, text, details, notes, article, content, report, page, lines, file]\ncategory: Document\nversion: \"1.55\"\nunicode: \"f028\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap= trình hòa giải hoặc tố tụng tranh chấp lao động.<\/p>\n                <div class=\"template-actions\">\n                    <button class=\"template-btn template-btn-view\" data-template=\"giay_uy_quyen\"><!--\ntags: [text, document, txt, doc, article, page, notes, file, content, paper]\ncategory: Document\nversion: \"1.0\"\nunicode: \"eaa2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M14 3v4a1 1 0 0 0 1 1h4\" />\n  <path d=\"M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\" />\n  <path d=\"M9 9l1 0\" />\n  <path d=\"M9 13l6 0\" />\n  <path d=\"M9 17l6 0\" />\n<\/svg>\n <span>Xem toàn văn & Sao chép<\/span><\/button>\n                    <button class=\"template-btn template-btn-ai\" data-query=\"Mẫu giấy ủy quyền tham gia giải quyết tranh chấp lao động\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Nhờ AI điền thông tin<\/span><\/button>\n                <\/div>\n            <\/div><\/div><\/section><\/div><div class=\"view-pane\" data-pane=\"situations\"><section class=\"resource-page\"><button class=\"text-link\" data-view=\"home\"><!--\nunicode: \"102b3\"\nversion: \"3.0\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"currentColor\"\n>\n  <path d=\"M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z\" />\n<\/svg>\n Trang chủ<\/button><h1>Tình huống thực tế<\/h1><p class=\"page-intro\">Các tình huống tranh chấp và rủi ro pháp lý thực tế phổ biến nhất theo nguồn phổ biến giáo dục pháp luật chính thống. Bấm xem cách giải quyết, căn cứ pháp lý và chế tài xử lý theo luật hiện hành.<\/p><div class=\"situations-grid\"><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">An toàn lao động<\/span>\n                    <h4>Từ chối làm việc khi sạt lở đe dọa tính mạng (Anh Dũng)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Công nhân vận hành máy xúc phát hiện vách núi có dấu hiệu sạt lở đe dọa trực tiếp tính mạng, từ chối làm việc và bị công ty kỷ luật, cắt thưởng.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điểm d Khoản 1 Điều 5 BLLĐ 2019 và Điều 16 Luật ATVSLĐ: NLĐ có quyền từ chối làm việc khi có nguy cơ rõ ràng đe dọa tính mạng, sức khỏe. Công ty kỷ luật và cắt thưởng là hoàn toàn trái luật.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Người lao động có quyền từ chối làm việc khi có nguy cơ sạt lở đe dọa tính mạng không và công ty cắt thưởng đúng hay sai?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Bảo hiểm xã hội<\/span>\n                    <h4>Công ty không đóng bảo hiểm và giữ sổ BHXH (Anh Vàng A Dơ)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Làm việc theo hợp đồng nhưng công ty trốn đóng BHXH, khi thôi việc không chốt và không trả lại sổ bảo hiểm xã hội.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 168, Điều 48 BLLĐ 2019 &amp; Điều 21 Luật BHXH: NSDLĐ bắt buộc phải tham gia BHXH và trả lại sổ BHXH; trốn đóng hoặc chiếm giữ sổ bị xử phạt nghiêm theo Nghị định 12/2022/NĐ-CP.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty không đóng bảo hiểm xã hội và giữ sổ BHXH của người lao động bị xử lý như thế nào?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Hợp đồng lao động<\/span>\n                    <h4>Làm việc lâu năm chỉ thỏa thuận miệng không ký hợp đồng (Anh Phúc)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Làm việc cắt gỗ hơn 1 năm, trả lương theo ngày, chủ xưởng không chịu ký HĐLĐ bằng văn bản viện cớ là chỗ người quen.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 13, 14 BLLĐ 2019: Công việc từ 1 tháng trở lên bắt buộc phải giao kết HĐLĐ bằng văn bản; hành vi không giao kết hợp đồng bị phạt tiền đến 50 triệu đồng.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Làm việc lâu năm chỉ thỏa thuận miệng không ký hợp đồng văn bản thì quyền lợi được bảo vệ thế nào?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Tiền lương<\/span>\n                    <h4>Công ty nợ lương, chậm trả lương liên tục nhiều tháng (Chị Nhung)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Công ty may nợ lương 3 tháng liên tiếp, viện lý do chưa thu được tiền hàng từ đối tác.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 97 BLLĐ 2019 quy định kỳ hạn trả lương. NLĐ có quyền đơn phương chấm dứt HĐLĐ không cần báo trước (Điểm b Khoản 2 Điều 35) và khiếu nại theo Nghị định 24/2018/NĐ-CP.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty nợ lương nhiều tháng người lao động có quyền nghỉ việc ngay và khiếu nại ở đâu?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Lao động chưa thành niên<\/span>\n                    <h4>Sử dụng lao động dưới 15 tuổi làm thêm giờ và ban đêm<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Tuyển người chưa đủ 15 tuổi làm việc 8-10 tiếng/ngày, bắt làm thêm giờ và làm việc ca đêm.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 143, 145, 146 BLLĐ 2019: Dưới 15 tuổi chỉ làm tối đa 4 giờ/ngày, 20 giờ/tuần; tuyệt đối cấm làm thêm giờ và ban đêm. Phạt tiền từ 20 - 25 triệu đồng theo Nghị định 12/2022.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Thuê lao động dưới 15 tuổi làm thêm giờ và làm ban đêm bị xử phạt thế nào?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Nghĩa vụ cung cấp thông tin<\/span>\n                    <h4>Khai man văn bằng khi xin việc (Chị Lò Thị Hoa)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Người lao động sử dụng bằng cấp không đúng thực tế để được tuyển dụng, sau đó bị doanh nghiệp phát hiện.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 16 BLLĐ 2019: Cung cấp thông tin sai sự thật cho phép NSDLĐ đơn phương chấm dứt HĐLĐ ngay (Điều 36) và NLĐ không được hưởng trợ cấp thôi việc.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Người lao động khai man bằng cấp xin việc bị xử lý thế nào và có được hưởng trợ cấp thôi việc không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Đơn phương chấm dứt HĐLĐ<\/span>\n                    <h4>Công ty không bố trí đúng công việc và địa điểm (Chị Trang)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Tuyển làm nhân viên chế biến gỗ tại xưởng A nhưng bị chuyển đi địa điểm khác không đúng thỏa thuận trong hợp đồng.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điểm a Khoản 2 Điều 35 BLLĐ 2019: NLĐ có quyền đơn phương chấm dứt HĐLĐ ngay không cần báo trước khi không được bố trí đúng công việc, địa điểm làm việc.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty chuyển địa điểm và công việc không đúng thỏa thuận người lao động có quyền nghỉ việc ngay không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Chế độ thai sản<\/span>\n                    <h4>Lao động nữ đi làm sớm trước khi hết thời gian nghỉ thai sản (Chị Lan)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Sinh con được 5 tháng xin đi làm lại trước thời hạn 6 tháng quy định, có văn bản đồng ý của NSDLĐ.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Khoản 4 Điều 139 BLLĐ 2019 &amp; Điều 40 Luật BHXH: Được đi làm sớm nếu đã nghỉ ít nhất 4 tháng và có xác nhận y tế; NLĐ được hưởng nguyên tiền lương và trọn vẹn trợ cấp thai sản.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Nghỉ thai sản đi làm sớm trước thời hạn có được hưởng nguyên lương và tiếp tục nhận tiền thai sản không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Lao động chưa thành niên<\/span>\n                    <h4>Thuê người 16 tuổi làm việc nặng nhọc tại công trường (Em Đạt)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Thiếu niên 16 tuổi xin phụ hồ, bốc vác vật liệu tại công trường xây dựng nhiều tầng.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 147 BLLĐ 2019 và Thông tư 09/2020/TT-BLĐTBXH: Nghiêm cấm sử dụng người dưới 18 tuổi làm việc tại công trường xây dựng hoặc công việc nặng nhọc, nguy hiểm danh mục cấm.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Có được thuê người 16 tuổi làm việc tại công trường xây dựng không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Lao động bán thời gian<\/span>\n                    <h4>Sinh viên làm thêm bán thời gian bị chủ quỵt lương viện cớ không phải HĐLĐ<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Sinh viên làm thêm ca tối, chủ cửa hàng tuyên bố thỏa thuận miệng không phải hợp đồng lao động nên không thanh toán lương.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 13, Điều 32 BLLĐ 2019: Làm việc không trọn thời gian vẫn là HĐLĐ được pháp luật bảo vệ đầy đủ quyền lợi, bình đẳng như lao động trọn thời gian.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Sinh viên làm thêm theo ca thỏa thuận miệng có được pháp luật bảo vệ quyền lợi tiền lương không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Kỷ luật lao động<\/span>\n                    <h4>Đánh nhau ở xưởng, công ty xử lý kỷ luật sau 8 tháng (Anh Khang)<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Hai công nhân xô xát trong giờ làm việc, sau 8 tháng công ty mới triệu tập họp xử lý kỷ luật sa thải.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 123 BLLĐ 2019: Thời hiệu xử lý kỷ luật lao động tối đa là 06 tháng. Sau 8 tháng thời hiệu đã hết, công ty không còn quyền kỷ luật lao động đối với hành vi này.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Xô xát đánh nhau tại nơi làm việc sau 8 tháng công ty có quyền xử lý kỷ luật sa thải nữa không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Trái pháp luật<\/span>\n                    <h4>Bị công ty giữ bản chính bằng đại học hoặc CCCD<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Công ty yêu cầu nộp bằng gốc đại học để cam kết làm việc tối thiểu 2 năm.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Điều 17 BLLĐ 2019 nghiêm cấm giữ giấy tờ tùy thân, văn bằng. Phạt tiền từ 20 - 25 triệu đồng theo Nghị định 12/2022/NĐ-CP.<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty bắt giữ bằng đại học gốc có vi phạm pháp luật không và xử lý thế nào?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Thời giờ làm việc<\/span>\n                    <h4>Bị ép làm thêm giờ (tăng ca) quá số giờ quy định<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Quản lý bắt buộc nhân viên ở lại làm thêm 3-4 tiếng mỗi ngày, không có thỏa thuận đồng ý.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Phải có sự đồng ý của NLĐ; không quá 40 giờ/tháng, 200 giờ/năm (trường hợp đặc biệt 300 giờ theo Điều 107 BLLĐ).<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty có được ép buộc nhân viên tăng ca không và quyền từ chối làm thêm giờ?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Sa thải trái luật<\/span>\n                    <h4>Bị sa thải đột ngột hoặc chấm dứt HĐLĐ qua tin nhắn/email<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Công ty báo nhân viên nghỉ việc ngay trong ngày mà không có lý do chính đáng hoặc không tổ chức họp kỷ luật.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Sa thải trái luật: Doanh nghiệp phải nhận lại làm việc, trả đủ lương những ngày không được làm việc và bồi thường ít nhất 2 tháng lương (Điều 41).<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Bị công ty đuổi việc đột ngột qua tin nhắn có phải sa thải trái luật không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Tai nạn lao động<\/span>\n                    <h4>Tai nạn giao thông trên đường từ nhà đến công ty<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Người lao động va chạm giao thông khi đang di chuyển trên lộ trình từ nơi ở đến nơi làm việc.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Được hưởng chế độ tai nạn lao động nếu xảy ra trên tuyến đường và thời gian hợp lý từ nơi ở đến nơi làm việc (Điều 45 Luật An toàn VSLĐ).<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Bị tai nạn giao thông trên đường đi làm có được thanh toán chế độ tai nạn lao động không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Bảo vệ lao động nữ<\/span>\n                    <h4>Lao động nữ mang thai bị công ty chấm dứt hợp đồng<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Công ty viện lý do tái cơ cấu để chấm dứt hợp đồng lao động với nhân viên đang mang thai tháng thứ 5.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Nghiêm cấm NSDLĐ sa thải hoặc đơn phương chấm dứt HĐLĐ đối với NLĐ vì lý do mang thai, nghỉ thai sản, nuôi con dưới 12 tháng (Điều 137 BLLĐ).<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty có được đuổi việc hoặc không gia hạn hợp đồng với nhân viên đang mang thai không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Thử việc sai luật<\/span>\n                    <h4>Thử việc kéo dài 3 tháng và trả lương dưới 85%<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Tuyển nhân viên kinh doanh trình độ đại học nhưng bắt thử việc 3 tháng với mức lương 70%.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Trình độ CĐ/ĐH thử việc tối đa 60 ngày; lương thử việc ít nhất 85% lương chính thức. Vi phạm bị phạt tiền và phải bồi hoàn đủ 100% lương (Điều 25, 26).<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Công ty bắt thử việc 3 tháng và trả lương 70% có đúng luật lao động không?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><div class=\"situation-card\">\n                <div class=\"situation-header\">\n                    <span class=\"situation-tag\">Khấu trừ lương<\/span>\n                    <h4>Công ty tự ý trừ tiền lương do nhân viên làm hỏng hàng<\/h4>\n                <\/div>\n                <div class=\"situation-body\">\n                    <div class=\"situation-fact\"><strong>Tình huống:<\/strong> Thiết bị bị hỏng hóc trong giờ làm việc, công ty tự động trừ hết 50% lương tháng mà không lập biên bản.<\/div>\n                    <div class=\"situation-law\"><strong>Căn cứ & Chế tài:<\/strong> Chỉ được khấu trừ bồi thường khi có thỏa thuận hoặc biên bản; mức khấu trừ không được quá 30% tiền lương tháng của NLĐ (Điều 102 BLLĐ).<\/div>\n                <\/div>\n                <button class=\"situation-btn\" data-query=\"Quy định về việc công ty trừ lương nhân viên khi làm hỏng thiết bị tài sản?\"><!--\ncategory: System\ntags: [balance, scales, justice, law, weigh, libra, legal, equality, scale]\nversion: \"1.1\"\nunicode: \"ebc2\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M7 20l10 0\" />\n  <path d=\"M6 6l6 -1l6 1\" />\n  <path d=\"M12 3l0 17\" />\n  <path d=\"M9 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n  <path d=\"M21 12l-3 -6l-3 6a3 3 0 0 0 6 0\" />\n<\/svg>\n <span>Giải quyết tình huống này với AI<\/span><\/button>\n            <\/div><\/div><\/section><\/div><div class=\"view-pane\" data-pane=\"faq\"><section class=\"resource-page\"><button class=\"text-link\" data-view=\"home\"><!--\nunicode: \"102b3\"\nversion: \"3.0\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"currentColor\"\n>\n  <path d=\"M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z\" />\n<\/svg>\n Trang chủ<\/button><h1>Câu hỏi thường gặp<\/h1><p class=\"page-intro\">Tuyển tập những vướng mắc pháp lý thường gặp nhất được trích xuất trực tiếp từ các quy định của Bộ luật Lao động 2019 và các văn bản thi hành.<\/p><div class=\"faq-list\"><details class=\"faq-accordion\" open>\n                <summary class=\"faq-question\">\n                    <span class=\"faq-q-icon\"><!--\ntags: [help, question, support, faq, question-mark, circle, info, assistance, unknown]\ncategory: System\nversion: \"2.10\"\nunicode: \"f91d\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" />\n  <path d=\"M12 16v.01\" />\n  <path d=\"M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483\" />\n<\/svg>\n<\/span>\n                    <strong>Người lao động ký hợp đồng 2 năm muốn xin nghỉ việc phải báo trước bao nhiêu ngày?<\/strong>\n                <\/summary>\n                <div class=\"faq-content\">\n                    <p>Theo Điều 35 Bộ luật Lao động 2019, đối với hợp đồng lao động xác định thời hạn từ 12 tháng đến 36 tháng, người lao động có quyền đơn phương chấm dứt hợp đồng lao động nhưng phải báo trước cho người sử dụng lao động ít nhất 30 ngày. Đặc biệt, nếu bị chậm trả lương, bị ngược đãi, đánh đập hoặc người sử dụng lao động bố trí không đúng công việc đã thỏa thuận, bạn có quyền nghỉ việc ngay lập tức mà không cần báo trước.<\/p>\n                    <button class=\"faq-ask-btn\" data-query=\"Thời hạn báo trước khi nghỉ việc hợp đồng lao động 2 năm?\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Hỏi sâu hơn về quy định này<\/span><\/button>\n                <\/div>\n            <\/details><details class=\"faq-accordion\" open>\n                <summary class=\"faq-question\">\n                    <span class=\"faq-q-icon\"><!--\ntags: [help, question, support, faq, question-mark, circle, info, assistance, unknown]\ncategory: System\nversion: \"2.10\"\nunicode: \"f91d\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" />\n  <path d=\"M12 16v.01\" />\n  <path d=\"M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483\" />\n<\/svg>\n<\/span>\n                    <strong>Thời gian thử việc tối đa là bao lâu và mức lương thử việc tối thiểu là bao nhiêu?<\/strong>\n                <\/summary>\n                <div class=\"faq-content\">\n                    <p>Theo Điều 25 và Điều 26 BLLĐ 2019: Thời gian thử việc tối đa là 180 ngày (người quản lý doanh nghiệp), 60 ngày (công việc có chức danh nghề nghiệp cần trình độ từ cao đẳng trở lên), 30 ngày (trung cấp, công nhân kỹ thuật), và 06 ngày làm việc đối với các công việc giản đơn khác. Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó.<\/p>\n                    <button class=\"faq-ask-btn\" data-query=\"Quy định thời gian thử việc tối đa và mức lương thử việc theo luật lao động?\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Hỏi sâu hơn về quy định này<\/span><\/button>\n                <\/div>\n            <\/details><details class=\"faq-accordion\" open>\n                <summary class=\"faq-question\">\n                    <span class=\"faq-q-icon\"><!--\ntags: [help, question, support, faq, question-mark, circle, info, assistance, unknown]\ncategory: System\nversion: \"2.10\"\nunicode: \"f91d\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" />\n  <path d=\"M12 16v.01\" />\n  <path d=\"M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483\" />\n<\/svg>\n<\/span>\n                    <strong>Làm thêm giờ (tăng ca) vào ban đêm và ngày nghỉ lễ Tết được tính tiền lương như thế nào?<\/strong>\n                <\/summary>\n                <div class=\"faq-content\">\n                    <p>Theo Điều 98 BLLĐ 2019: Làm thêm ngày thường hưởng ít nhất 150%; ngày nghỉ hàng tuần hưởng ít nhất 200%; ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương hưởng ít nhất 300% (chưa kể tiền lương ngày lễ đối với người hưởng lương ngày). Nếu làm thêm vào ban đêm (từ 22h đến 06h sáng hôm sau), bạn còn được trả thêm ít nhất 30% tiền lương tính theo đơn giá tiền lương ban ngày và thêm 20% tiền lương của công việc làm vào ban ngày của ngày đó.<\/p>\n                    <button class=\"faq-ask-btn\" data-query=\"Cách tính tiền lương làm thêm giờ ban đêm và ngày nghỉ lễ Tết?\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Hỏi sâu hơn về quy định này<\/span><\/button>\n                <\/div>\n            <\/details><details class=\"faq-accordion\" open>\n                <summary class=\"faq-question\">\n                    <span class=\"faq-q-icon\"><!--\ntags: [help, question, support, faq, question-mark, circle, info, assistance, unknown]\ncategory: System\nversion: \"2.10\"\nunicode: \"f91d\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" />\n  <path d=\"M12 16v.01\" />\n  <path d=\"M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483\" />\n<\/svg>\n<\/span>\n                    <strong>Điều kiện và cách tính tiền trợ cấp thôi việc khi chấm dứt hợp đồng lao động?<\/strong>\n                <\/summary>\n                <div class=\"faq-content\">\n                    <p>Theo Điều 46 BLLĐ 2019: Người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động đã làm việc thường xuyên từ đủ 12 tháng trở lên. Mỗi năm làm việc được trợ cấp một nửa tháng tiền lương. Thời gian tính trợ cấp thôi việc là tổng thời gian làm việc thực tế trừ đi thời gian đã tham gia bảo hiểm thất nghiệp (BHTN) và thời gian đã được chi trả trợ cấp thôi việc trước đó. Tiền lương tính trợ cấp là bình quân tiền lương 06 tháng liền kề trước khi nghỉ việc.<\/p>\n                    <button class=\"faq-ask-btn\" data-query=\"Điều kiện và công thức tính trợ cấp thôi việc theo BLLĐ 2019?\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Hỏi sâu hơn về quy định này<\/span><\/button>\n                <\/div>\n            <\/details><details class=\"faq-accordion\" open>\n                <summary class=\"faq-question\">\n                    <span class=\"faq-q-icon\"><!--\ntags: [help, question, support, faq, question-mark, circle, info, assistance, unknown]\ncategory: System\nversion: \"2.10\"\nunicode: \"f91d\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" />\n  <path d=\"M12 16v.01\" />\n  <path d=\"M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483\" />\n<\/svg>\n<\/span>\n                    <strong>Người lao động làm việc 1 năm được bao nhiêu ngày phép năm? Thôi việc chưa nghỉ hết có được thanh toán tiền không?<\/strong>\n                <\/summary>\n                <div class=\"faq-content\">\n                    <p>Theo Điều 113 BLLĐ 2019: Người lao động làm việc đủ 12 tháng trong điều kiện bình thường được nghỉ 12 ngày làm việc hưởng nguyên lương. Cứ đủ 05 năm làm việc cho một người sử dụng lao động thì số ngày nghỉ phép năm được tăng thêm tương ứng 01 ngày (Điều 114). Trường hợp do thôi việc, mất việc làm mà chưa nghỉ hết số ngày nghỉ hằng năm thì được người sử dụng lao động thanh toán tiền lương cho những ngày chưa nghỉ.<\/p>\n                    <button class=\"faq-ask-btn\" data-query=\"Quy định về ngày nghỉ phép năm và thanh toán tiền phép năm chưa nghỉ hết?\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Hỏi sâu hơn về quy định này<\/span><\/button>\n                <\/div>\n            <\/details><details class=\"faq-accordion\" open>\n                <summary class=\"faq-question\">\n                    <span class=\"faq-q-icon\"><!--\ntags: [help, question, support, faq, question-mark, circle, info, assistance, unknown]\ncategory: System\nversion: \"2.10\"\nunicode: \"f91d\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" />\n  <path d=\"M12 16v.01\" />\n  <path d=\"M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483\" />\n<\/svg>\n<\/span>\n                    <strong>Người sử dụng lao động có được giữ bản chính CMND/CCCD hoặc bằng đại học của người lao động không?<\/strong>\n                <\/summary>\n                <div class=\"faq-content\">\n                    <p>Theo Điều 17 BLLĐ 2019: Pháp luật nghiêm cấm hành vi giữ bản chính giấy tờ tùy thân, văn bằng, chứng chỉ của người lao động khi giao kết, thực hiện hợp đồng lao động. Theo Nghị định 12/2022/NĐ-CP (Điều 9), người sử dụng lao động có hành vi giữ bản chính giấy tờ tùy thân, văn bằng của người lao động sẽ bị xử phạt vi phạm hành chính từ 20.000.000 đồng đến 25.000.000 đồng và buộc phải trả lại giấy tờ ngay lập tức.<\/p>\n                    <button class=\"faq-ask-btn\" data-query=\"Doanh nghiệp giữ bằng đại học gốc của nhân viên bị phạt bao nhiêu?\"><!--\ntags: [chat, comment, speech-bubble, round, conversation, sms, reply, communication, dm, messaging, bubble, whatsapp, message, circle]\ncategory: Communication\nversion: \"1.0\"\nunicode: \"eaed\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1\" />\n<\/svg>\n <span>Hỏi sâu hơn về quy định này<\/span><\/button>\n                <\/div>\n            <\/details><\/div><\/section><\/div><div class=\"view-pane\" data-pane=\"news\"><section class=\"resource-page\"><button class=\"text-link\" data-view=\"home\"><!--\nunicode: \"102b3\"\nversion: \"3.0\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"currentColor\"\n>\n  <path d=\"M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z\" />\n<\/svg>\n Trang chủ<\/button><h1>Tin tức - Cập nhật<\/h1><p class=\"page-intro\">Cập nhật những thay đổi pháp lý, văn bản chỉ đạo và tin tức chính sách lao động - tiền lương - bảo hiểm xã hội mới nhất.<\/p><div class=\"news-full-grid\"><article class=\"news-card-rich\">\n                <div class=\"news-meta\">\n                    <span class=\"news-badge\">Chính sách mới<\/span>\n                    <span class=\"news-date\">2026<\/span>\n                <\/div>\n                <h3>Nghị định mới về mức lương tối thiểu vùng: Những điều chỉnh người lao động cần biết<\/h3>\n                <p>Chính phủ ban hành quy định mới về mức lương tối thiểu theo tháng và theo giờ. Mức lương áp dụng cho 4 vùng kinh tế nhằm bảo đảm mức sống tối thiểu của người lao động trong bối cảnh giá cả thị trường biến động.<\/p>\n                <button class=\"news-read-btn\" data-query=\"Mức lương tối thiểu vùng mới nhất hiện nay là bao nhiêu và cách áp dụng?\"><!--\ntags: [chevron, arrow, right, next, forward, more, caret-right, arrow-right, direction, navigation, angle]\ncategory: Arrows\nversion: \"1.0\"\nunicode: \"ea61\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M9 6l6 6l-6 6\" />\n<\/svg>\n <span>Tra cứu quy định liên quan<\/span><\/button>\n            <\/article><article class=\"news-card-rich\">\n                <div class=\"news-meta\">\n                    <span class=\"news-badge\">Chuyển đổi số<\/span>\n                    <span class=\"news-date\">2026<\/span>\n                <\/div>\n                <h3>Quy định chi tiết về giao kết hợp đồng lao động điện tử và giá trị pháp lý chữ ký số<\/h3>\n                <p>Hướng dẫn toàn diện về giá trị pháp lý của hợp đồng lao động điện tử theo quy định mới, các phương tiện xác thực số hợp lệ và nghĩa vụ bảo mật dữ liệu nhân sự của doanh nghiệp.<\/p>\n                <button class=\"news-read-btn\" data-query=\"Hợp đồng lao động điện tử có giá trị pháp lý tương đương hợp đồng giấy không?\"><!--\ntags: [chevron, arrow, right, next, forward, more, caret-right, arrow-right, direction, navigation, angle]\ncategory: Arrows\nversion: \"1.0\"\nunicode: \"ea61\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M9 6l6 6l-6 6\" />\n<\/svg>\n <span>Tra cứu quy định liên quan<\/span><\/button>\n            <\/article><article class=\"news-card-rich\">\n                <div class=\"news-meta\">\n                    <span class=\"news-badge\">Thanh tra - Xử phạt<\/span>\n                    <span class=\"news-date\">2026<\/span>\n                <\/div>\n                <h3>Tăng cường thanh tra xử phạt nghiêm các hành vi vi phạm về tiền lương và bảo hiểm xã hội<\/h3>\n                <p>Bộ Lao động - Thương binh và Xã hội đẩy mạnh thanh tra chuyên ngành, tập trung vào các hành vi nợ lương kéo dài, trốn đóng BHXH, bắt buộc làm thêm giờ trái thỏa thuận theo Nghị định 12/2022/NĐ-CP.<\/p>\n                <button class=\"news-read-btn\" data-query=\"Các mức phạt hành chính đối với hành vi nợ lương và trốn đóng BHXH của công ty?\"><!--\ntags: [chevron, arrow, right, next, forward, more, caret-right, arrow-right, direction, navigation, angle]\ncategory: Arrows\nversion: \"1.0\"\nunicode: \"ea61\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M9 6l6 6l-6 6\" />\n<\/svg>\n <span>Tra cứu quy định liên quan<\/span><\/button>\n            <\/article><article class=\"news-card-rich\">\n                <div class=\"news-meta\">\n                    <span class=\"news-badge\">Bảo vệ quyền lợi<\/span>\n                    <span class=\"news-date\">2026<\/span>\n                <\/div>\n                <h3>Cẩm nang bảo vệ quyền lợi lao động nữ: Chế độ thai sản, nuôi con nhỏ và phòng chống quấy rối<\/h3>\n                <p>Hệ thống quy định bảo vệ thai sản, quyền từ chối làm việc ban đêm hoặc làm thêm giờ khi mang thai từ tháng thứ 7, cùng các quy định bắt buộc về phòng chống quấy rối tình dục tại nơi làm việc.<\/p>\n                <button class=\"news-read-btn\" data-query=\"Quy định pháp luật bảo vệ lao động nữ mang thai và nuôi con nhỏ dưới 12 tháng?\"><!--\ntags: [chevron, arrow, right, next, forward, more, caret-right, arrow-right, direction, navigation, angle]\ncategory: Arrows\nversion: \"1.0\"\nunicode: \"ea61\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M9 6l6 6l-6 6\" />\n<\/svg>\n <span>Tra cứu quy định liên quan<\/span><\/button>\n            <\/article><\/div><\/section><\/div><div class=\"view-pane\" data-pane=\"graph\"><section class=\"resource-page\"><button class=\"text-link\" data-view=\"home\"><!--\nunicode: \"102b3\"\nversion: \"3.0\"\n-->\n<svg aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"currentColor\"\n>\n  <path d=\"M12.707 2.293l9 9c.63 .63 .184 1.707 -.707 1.707h-1v6a3 3 0 0 1 -3 3h-1v-7a3 3 0 0 0 -2.824 -2.995l-.176 -.005h-2a3 3 0 0 0 -3 3v7h-1a3 3 0 0 1 -3 -3v-6h-1c-.89 0 -1.337 -1.077 -.707 -1.707l9 -9a1 1 0 0 1 1.414 0m.293 11.707a1 1 0 0 1 1 1v7h-4v-7a1 1 0 0 1 .883 -.993l.117 -.007z\" />\n<\/svg>\n Trang chủ<\/button><h1>Đồ thị tri thức<\/h1><p class=\"page-intro\">Quan hệ giữa các nghị định và điều khoản Bộ luật Lao động 2019 mà tầng đồ thị dùng để mở rộng truy hồi. Bấm một quan hệ để hỏi trợ lý về nội dung đó.<\/p><div class=\"kg-card\"><svg class=\"kg-svg\" viewBox=\"0 0 660 386\" role=\"img\" aria-label=\"Sơ đồ 8 quan hệ giữa nghị định và Bộ luật Lao động 2019\"><defs><marker id=\"kg-arrow-kg-guides\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" or
