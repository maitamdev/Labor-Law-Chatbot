eo th\\u1ea9m quy\\u1ec1n:\\n1. X\\u00e1c minh, thanh tra v\\u00e0 k\\u1ebft lu\\u1eadn v\\u1ec1 h\\u00e0nh vi vi ph\\u1ea1m ph\\u00e1p lu\\u1eadt lao \\u0111\\u1ed9ng c\\u1ee7a C\\u00f4ng ty n\\u00eau tr\\u00ean.\\n2. X\\u1eed ph\\u1ea1t vi ph\\u1ea1m h\\u00e0nh ch\\u00ednh \\u0111\\u1ed1i v\\u1edbi h\\u00e0nh vi vi ph\\u1ea1m theo \\u0111\\u00fang quy \\u0111\\u1ecbnh t\\u1ea1i Ngh\\u1ecb \\u0111\\u1ecbnh 12/2022/N\\u0110-CP.\\n3. Bu\\u1ed9c C\\u00f4ng ty ph\\u1ea3i kh\\u1eafc ph\\u1ee5c h\\u1eadu qu\\u1ea3: Thanh to\\u00e1n to\\u00e0n b\\u1ed9 c\\u00e1c kho\\u1ea3n ti\\u1ec1n quy\\u1ec1n l\\u1ee3i c\\u00f2n n\\u1ee3, ch\\u1ed1t tr\\u1ea3 s\\u1ed5 BHXH (ho\\u1eb7c tr\\u1ea3 l\\u1ea1i b\\u1eb1ng c\\u1ea5p/gi\\u1ea5y t\\u1edd) cho t\\u00f4i.\\n\\nT\\u00c0I LI\\u1ec6U, CH\\u1ee8NG C\\u1ee8 K\\u00c8M THEO:\\n1. B\\u1ea3n sao H\\u1ee3p \\u0111\\u1ed3ng lao \\u0111\\u1ed9ng s\\u1ed1: ....................................................................\\n2. B\\u1ea3n sao CCCD c\\u1ee7a Ng\\u01b0\\u1eddi khi\\u1ebfu n\\u1ea1i;\\n3. B\\u1ea3ng thanh to\\u00e1n l\\u01b0\\u01a1ng / Sao k\\u00ea t\\u00e0i kho\\u1ea3n ng\\u00e2n h\\u00e0ng th\\u1ec3 hi\\u1ec7n n\\u1ee3 l\\u01b0\\u01a1ng;\\n4. C\\u00e1c v\\u0103n b\\u1ea3n, th\\u00f4ng b\\u00e1o, tin nh\\u1eafn, email trao \\u0111\\u1ed5i li\\u00ean quan.\\n\\nT\\u00f4i xin cam \\u0111oan to\\u00e0n b\\u1ed9 n\\u1ed9i dung tr\\u00ecnh b\\u00e0y tr\\u00ean l\\u00e0 \\u0111\\u00fang s\\u1ef1 th\\u1eadt v\\u00e0 ho\\u00e0n to\\u00e0n ch\\u1ecbu tr\\u00e1ch nhi\\u1ec7m tr\\u01b0\\u1edbc ph\\u00e1p lu\\u1eadt.\\n\\n                                          ........., ng\\u00e0y ..... th\\u00e1ng ..... n\\u0103m 202...\\n                                                      NG\\u01af\\u1edcI KHI\\u1ebeU N\\u1ea0I\\n                                                    (K\\u00fd v\\u00e0 ghi r\\u00f5 h\\u1ecd t\\u00ean)\\n\"}, {\"id\": \"giay_uy_quyen\", \"title\": \"Gi\\u1ea5y \\u1ee7y quy\\u1ec1n gi\\u1ea3i quy\\u1ebft tranh ch\\u1ea5p lao \\u0111\\u1ed9ng\", \"tag\": \"\\u1ee6y quy\\u1ec1n\", \"basis\": \"B\\u1ed9 lu\\u1eadt D\\u00e2n s\\u1ef1 2015 & B\\u1ed9 lu\\u1eadt Lao \\u0111\\u1ed9ng 2019\", \"summary\": \"\\u1ee6y quy\\u1ec1n h\\u1ee3p ph\\u00e1p cho ng\\u01b0\\u1eddi \\u0111\\u1ea1i di\\u1ec7n tham gia qu\\u00e1 tr\\u00ecnh h\\u00f2a gi\\u1ea3i ho\\u1eb7c t\\u1ed1 t\\u1ee5ng tranh ch\\u1ea5p lao \\u0111\\u1ed9ng.\", \"query\": \"M\\u1eabu gi\\u1ea5y \\u1ee7y quy\\u1ec1n tham gia gi\\u1ea3i quy\\u1ebft tranh ch\\u1ea5p lao \\u0111\\u1ed9ng\", \"content\": \"C\\u1ed8NG H\\u00d2A X\\u00c3 H\\u1ed8I CH\\u1ee6 NGH\\u0128A VI\\u1ec6T NAM\\n\\u0110\\u1ed9c l\\u1eadp - T\\u1ef1 do - H\\u1ea1nh ph\\u00fac\\n-----------------\\n\\nGI\\u1ea4Y \\u1ee6Y QUY\\u1ec0N\\n(V/v: Tham gia gi\\u1ea3i quy\\u1ebft tranh ch\\u1ea5p lao \\u0111\\u1ed9ng)\\n\\n- C\\u0103n c\\u1ee9 B\\u1ed9 lu\\u1eadt D\\u00e2n s\\u1ef1 s\\u1ed1 91/2015/QH13 ng\\u00e0y 24 th\\u00e1ng 11 n\\u0103m 2015;\\n- C\\u0103n c\\u1ee9 B\\u1ed9 lu\\u1eadt Lao \\u0111\\u1ed9ng s\\u1ed1 45/2019/QH14 ng\\u00e0y 20 th\\u00e1ng 11 n\\u0103m 2019;\\n\\nH\\u00f4m nay, ng\\u00e0y ..... th\\u00e1ng ..... n\\u0103m 202..., t\\u1ea1i: ................................................................\\nCh\\u00fang t\\u00f4i g\\u1ed3m c\\u00f3:\\n\\nB\\u00caN \\u1ee6Y QUY\\u1ec0N (B\\u00caN A):\\n- H\\u1ecd v\\u00e0 t\\u00ean: .................................................... Sinh ng\\u00e0y: ...../...../.........\\n- S\\u1ed1 CCCD: ........................... Ng\\u00e0y c\\u1ea5p: ............. N\\u01a1i c\\u1ea5p: ...............................\\n- N\\u01a1i \\u0111\\u0103ng k\\u00fd th\\u01b0\\u1eddng tr\\u00fa: .................................................................................\\n- N\\u01a1i \\u1edf hi\\u1ec7n nay: ............................................................................................\\n- S\\u1ed1 \\u0111i\\u1ec7n tho\\u1ea1i: ............................................... Email: ........................................\\n\\nB\\u00caN \\u0110\\u01af\\u1ee2C \\u1ee6Y QUY\\u1ec0N (B\\u00caN B):\\n- H\\u1ecd v\\u00e0 t\\u00ean: .................................................... Sinh ng\\u00e0y: ...../...../.........\\n- S\\u1ed1 CCCD: ........................... Ng\\u00e0y c\\u1ea5p: ............. N\\u01a1i c\\u1ea5p: ...............................\\n- N\\u01a1i \\u0111\\u0103ng k\\u00fd th\\u01b0\\u1eddng tr\\u00fa: .................................................................................\\n- N\\u01a1i \\u1edf hi\\u1ec7n nay: ............................................................................................\\n- S\\u1ed1 \\u0111i\\u1ec7n tho\\u1ea1i: ............................................... Quan h\\u1ec7 v\\u1edbi B\\u00ean A: ....................\\n\\nN\\u1ed8I DUNG \\u1ee6Y QUY\\u1ec0N:\\nB\\u00ean A \\u0111\\u1ed3ng \\u00fd \\u1ee7y quy\\u1ec1n cho B\\u00ean B thay m\\u1eb7t v\\u00e0 nh\\u00e2n danh B\\u00ean A th\\u1ef1c hi\\u1ec7n c\\u00e1c c\\u00f4ng vi\\u1ec7c sau:\\n1. \\u0110\\u1ea1i di\\u1ec7n B\\u00ean A li\\u00ean h\\u1ec7, l\\u00e0m vi\\u1ec7c v\\u1edbi C\\u00f4ng ty ................................................... \\u0111\\u1ec3 gi\\u1ea3i quy\\u1ebft c\\u00e1c v\\u1ea5n \\u0111\\u1ec1 li\\u00ean quan \\u0111\\u1ebfn quan h\\u1ec7 lao \\u0111\\u1ed9ng v\\u00e0 tranh ch\\u1ea5p lao \\u0111\\u1ed9ng ph\\u00e1t sinh.\\n2. Tham gia c\\u00e1c bu\\u1ed5i l\\u00e0m vi\\u1ec7c, \\u0111\\u1ed1i tho\\u1ea1i, phi\\u00ean h\\u00f2a gi\\u1ea3i tranh ch\\u1ea5p lao \\u0111\\u1ed9ng t\\u1ea1i H\\u00f2a gi\\u1ea3i vi\\u00ean lao \\u0111\\u1ed9ng, H\\u1ed9i \\u0111\\u1ed3ng Tr\\u1ecdng t\\u00e0i lao \\u0111\\u1ed9ng, ho\\u1eb7c S\\u1edf/Ph\\u00f2ng Lao \\u0111\\u1ed9ng - TB&XH.\\n3. Cung c\\u1ea5p ch\\u1ee9ng c\\u1ee9, t\\u00e0i li\\u1ec7u, tr\\u00ecnh b\\u00e0y \\u00fd ki\\u1ebfn, k\\u00fd k\\u1ebft c\\u00e1c bi\\u00ean b\\u1ea3n l\\u00e0m vi\\u1ec7c v\\u00e0 v\\u0103n b\\u1ea3n th\\u1ecfa thu\\u1eadn trong ph\\u1ea1m vi \\u1ee7y quy\\u1ec1n h\\u1ee3p ph\\u00e1p.\\n\\nPH\\u1ea0M VI V\\u00c0 TH\\u1edcI H\\u1ea0N \\u1ee6Y QUY\\u1ec0N:\\n1. B\\u00ean B kh\\u00f4ng \\u0111\\u01b0\\u1ee3c \\u1ee7y quy\\u1ec1n l\\u1ea1i cho b\\u1ea5t k\\u1ef3 b\\u00ean th\\u1ee9 ba n\\u00e0o kh\\u00e1c n\\u1ebfu kh\\u00f4ng c\\u00f3 s\\u1ef1 \\u0111\\u1ed3ng \\u00fd b\\u1eb1ng v\\u0103n b\\u1ea3n c\\u1ee7a B\\u00ean A.\\n2. Gi\\u1ea5y \\u1ee7y quy\\u1ec1n n\\u00e0y c\\u00f3 hi\\u1ec7u l\\u1ef1c k\\u1ec3 t\\u1eeb ng\\u00e0y k\\u00fd cho \\u0111\\u1ebfn khi v\\u1ee5 vi\\u1ec7c tranh ch\\u1ea5p lao \\u0111\\u1ed9ng \\u0111\\u01b0\\u1ee3c gi\\u1ea3i quy\\u1ebft xong, ho\\u1eb7c khi B\\u00ean A c\\u00f3 v\\u0103n b\\u1ea3n ch\\u1ea5m d\\u1ee9t vi\\u1ec7c \\u1ee7y quy\\u1ec1n.\\n\\nHai b\\u00ean cam k\\u1ebft ho\\u00e0n to\\u00e0n t\\u1ef1 nguy\\u1ec7n th\\u1ef1c hi\\u1ec7n \\u0111\\u00fang c\\u00e1c n\\u1ed9i dung \\u1ee7y quy\\u1ec1n v\\u00e0 ch\\u1ecbu tr\\u00e1ch nhi\\u1ec7m tr\\u01b0\\u1edbc ph\\u00e1p lu\\u1eadt.\\n\\n          B\\u00caN \\u0110\\u01af\\u1ee2C \\u1ee6Y QUY\\u1ec0N (B\\u00caN B)                          B\\u00caN \\u1ee6Y QUY\\u1ec0N (B\\u00caN A)\\n            (K\\u00fd v\\u00e0 ghi r\\u00f5 h\\u1ecd t\\u00ean)                            (K\\u00fd v\\u00e0 ghi r\\u00f5 h\\u1ecd t\\u00ean)\\n\"}]<\/script>\n      <template id=\"history-content\"><p>Chưa có lịch sử trò chuyện.<\/p><\/template><div class=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n    <\/div>", "conversation_id": "demo:preview", "messages": []}</script><script type="module">function renderDemo(component) {
  try {
    const {parentElement, data, setTriggerValue} = component || {};
    if (!parentElement || !data || typeof data.markup !== 'string') {
      return () => {};
    }
    let mount = parentElement.querySelector('.vl-mount');
    if (!mount) {
      mount = document.createElement('div');
      mount.className = 'vl-mount';
      parentElement.appendChild(mount);
    }
    const oldInput = mount.querySelector('#vl-question');
    const previousDraft = oldInput ? oldInput.value : '';
    const oldConversation = mount.dataset ? mount.dataset.conversation : '';
    const oldAuthDialog = mount.querySelector('.auth-dialog');
    const oldAuthOpen = Boolean(oldAuthDialog?.open);
    const oldAuthMode = oldAuthDialog?.dataset.mode || 'login';
    const oldAuthUsername = oldAuthDialog?.querySelector('[name="username"]')?.value || '';
    const oldAuthPending = Boolean(oldAuthDialog?.querySelector('.auth-submit')?.disabled);
    // Markup is constructed and escaped by the server. User text is never
    // concatenated into DOM markup here.
    mount.innerHTML = data.markup;
    mount.dataset.conversation = data.conversation_id || '';
    const app = mount.querySelector('.vl-app');
    if (!app) {
      return () => {};
    }
    const input = app.querySelector('#vl-question');
    const busy = app.dataset ? (app.dataset.busy === 'true') : false;
    let sent = false;
    let toastTimer;
    let actionSeq = 0;
    const emit = action => {
      if (!action || typeof action !== 'object') return;
      if (action.type === 'query') {
        if (sent || busy) return;
        sent = true;
        setTimeout(() => { sent = false; }, 2500);
      }
      action.action_id = String(Date.now()) + '_' + (++actionSeq) + '_' + Math.random().toString(36).slice(2, 7);
      setTriggerValue('action', action);
    };
    const toast = text => {
      const node = app.querySelector('.toast');
      if (!node) return;
      node.textContent = text;
      node.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove('visible'), 3200);
    };
    const authDialog = app.querySelector('.auth-dialog');
    const authForm = authDialog?.querySelector('.auth-form');
    let authPending = false;
    const setAuthMode = mode => {
      if (!authDialog) return;
      const register = mode === 'register';
      authDialog.dataset.mode = register ? 'register' : 'login';
      const password = authDialog.querySelector('[name="password"]');
      const confirm = authDialog.querySelector('[name="confirm_password"]');
      password.autocomplete = register ? 'new-password' : 'current-password';
      password.minLength = register ? 8 : 1;
      confirm.required = register;
      authDialog.querySelector('.auth-error').hidden = true;
    };
    const showAuthError = message => {
      const error = authDialog?.querySelector('.auth-error');
      if (error) { error.textContent = message; error.hidden = false; }
    };
    const openAuth = mode => {
      if (!authDialog) return;
      if (busy) { toast('Bạn có thể đăng nhập sau khi trợ lý trả lời xong.'); return; }
      setAuthMode(mode);
      if (!authDialog.open) authDialog.showModal();
      authDialog.querySelector('[name="username"]').focus();
    };
    const closeAuth = () => { if (authDialog?.open && !authPending) authDialog.close(); };
    const onAuthSubmit = event => {
      event.preventDefault();
      if (authPending || busy) return;
      const username = authForm.elements.username.value.trim();
      const password = authForm.elements.password.value;
      const confirm = authForm.elements.confirm_password.value;
      const mode = authDialog.dataset.mode;
      if (mode === 'register' && password !== confirm) {
        showAuthError('Hai mật khẩu chưa khớp. Vui lòng kiểm tra lại.');
        return;
      }
      if (!authForm.reportValidity()) return;
      authPending = true;
      authForm.querySelector('.auth-submit').disabled = true;
      authForm.querySelectorAll('.auth-submit span').forEach(node => { node.textContent = 'Đang xử lý…'; });
      emit({type:'auth_submit', mode, username, password, confirm_password:confirm});
      authForm.elements.password.value = '';
      authForm.elements.confirm_password.value = '';
    };
    const onAuthBackdrop = event => {
      if (event.target !== authDialog) return;
      const box = authDialog.getBoundingClientRect();
      if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeAuth();
    };
    if (authDialog && authForm) {
      authForm.addEventListener('submit', onAuthSubmit);
      authDialog.addEventListener('click', onAuthBackdrop);
      authDialog.querySelector('[name="username"]').value = data.auth_username || oldAuthUsername;
      if (data.auth_open || oldAuthOpen) {
        openAuth(data.auth_open ? data.auth_mode : oldAuthMode);
        if (data.auth_error) showAuthError(data.auth_error);
        if (oldAuthPending && !data.auth_open) {
          authPending = true;
          authForm.querySelector('.auth-submit').disabled = true;
          authForm.querySelectorAll('.auth-submit span').forEach(node => { node.textContent = 'Đang xử lý…'; });
        }
      }
    }
  // Auto-scroll message-feed internally to latest message
  const scrollToLatest = (smooth = true) => {
    try {
      const feed = app.querySelector('.message-feed');
      if (feed) {
        feed.scrollTo({ top: feed.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
      }
    } catch (_) {
      try {
        const feed = app.querySelector('.message-feed');
        if (feed) feed.scrollTop = feed.scrollHeight;
      } catch (_) {}
    }
  };
  if (app.dataset.view === 'chat') {
    setTimeout(() => scrollToLatest(false), 40);
    setTimeout(() => scrollToLatest(false), 150);
  }

  // Progressive Typewriter streaming reveal for newly generated assistant messages
  let typeTimer;
  try {
    const typingTarget = app.querySelector('.assistant-message[data-typing="true"]');
    if (typingTarget) {
      const mdContainer = typingTarget.querySelector('.answer-markdown');
      if (mdContainer) {
        // Find all non-empty text nodes in the already-rendered DOM tree
        const whatToShow = (typeof NodeFilter !== 'undefined' && NodeFilter.SHOW_TEXT) ? NodeFilter.SHOW_TEXT : 4;
        const walker = document.createTreeWalker(mdContainer, whatToShow, null, false);
        const textNodes = [];
        let textNode;
        while ((textNode = walker.nextNode())) {
          if (textNode.nodeValue && textNode.nodeValue.length > 0) {
            textNodes.push({ node: textNode, fullText: textNode.nodeValue });
            textNode.nodeValue = '';
          }
        }

        if (textNodes.length > 0) {
          typingTarget.classList.add('is-typing');
          const cursor = document.createElement('span');
          cursor.className = 'typing-cursor';

          let nodeIdx = 0;
          let charIdx = 0;
          let finished = false;

          const finishTyping = () => {
            if (finished) return;
            finished = true;
            if (typeTimer) clearInterval(typeTimer);
            for (let i = 0; i < textNodes.length; i++) {
              try { textNodes[i].node.nodeValue = textNodes[i].fullText; } catch (_) {}
            }
            try { if (cursor.parentNode) cursor.remove(); } catch (_) {}
            typingTarget.classList.remove('is-typing');
            typingTarget.removeAttribute('data-typing');
            scrollToLatest(true);
          };

          // Click anywhere on message to immediately reveal all text
          typingTarget.addEventListener('click', finishTyping, { once: true });

          typeTimer = setInterval(() => {
            try {
              if (nodeIdx >= textNodes.length) {
                finishTyping();
                return;
              }

              const cur = textNodes[nodeIdx];
              if (cur && cur.node && cur.node.parentNode && cursor.parentNode !== cur.node.parentNode) {
                cur.node.parentNode.insertBefore(cursor, cur.node.nextSibling);
              }

              // Progressive reveal: 3-5 chars per tick gives smooth natural typewriter speed (~200 chars/s)
              const step = Math.min(4, cur.fullText.length - charIdx);
              charIdx += step;
              cur.node.nodeValue = cur.fullText.slice(0, charIdx);

              scrollToLatest(false);

              if (charIdx >= cur.fullText.length) {
                nodeIdx++;
                charIdx = 0;
              }
            } catch (_) {
              finishTyping();
            }
          }, 16);
        } else {
          typingTarget.classList.remove('is-typing');
          typingTarget.removeAttribute('data-typing');
        }
      }
    }
  } catch (err) {
    console.warn('[VietLaborAI] Typewriter initialization error:', err);
  }

  // Dynamic progress cycling while assistant is busy
  let thinkingTimer;
  if (busy) {
    setTimeout(() => scrollToLatest(true), 150);
    const thinkingText = app.querySelector('#vl-thinking-text');
    if (thinkingText) {
      const steps = [
        "Đang tra cứu cơ sở dữ liệu pháp luật lao động...",
        "Đang phân tích và đối soát căn cứ pháp lý...",
        "Đang trích xuất điều khoản và chế tài...",
        "Đang tổng hợp lập luận và soạn thảo tư vấn...",
      ];
      let stepIdx = 0;
      thinkingTimer = setInterval(() => {
        stepIdx = (stepIdx + 1) % steps.length;
        if (thinkingText && app.contains(thinkingText)) {
          thinkingText.textContent = steps[stepIdx];
        } else {
          clearInterval(thinkingTimer);
        }
      }, 2400);
    }
  }

  const formatBytes = bytes => {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  };

  const draftKey = 'vietlaborai-draft:' + data.conversation_id;
  const composers = app.querySelectorAll('.composer');

  composers.forEach(form => {
    const input = form.querySelector('#vl-question') || form.querySelector('textarea');
    const counter = form.querySelector('.counter');
    const fileInput = form.querySelector('.vl-file-input');
    const attachBtn = form.querySelector('[data-attach-btn]');
    const bar = form.querySelector('.composer-attachment-bar');
    const previewName = form.querySelector('.preview-name');
    const previewSize = form.querySelector('.preview-size');
    const previewRemove = form.querySelector('.preview-remove');

    let formAttachment = null;

    if (input) {
      try {
        if (oldConversation === data.conversation_id && previousDraft) {
          input.value = previousDraft;
        } else {
          input.value = sessionStorage.getItem(draftKey) || '';
        }
      } catch (_) {}

      const updateCounter = () => {
        if (counter) counter.textContent = input.value.length + '/2000';
        try { sessionStorage.setItem(draftKey, input.value); } catch (_) {}
      };
      input.addEventListener('input', updateCounter);
      updateCounter();

      const submit = event => {
        if (event) event.preventDefault();
        const text = input.value.trim();
        const att = formAttachment;
        if ((!text && !att) || sent || busy) {
          if (!text && !att) input.focus();
          return;
        }
        input.value = '';
        formAttachment = null;
        if (fileInput) fileInput.value = '';
        if (bar) bar.style.display = 'none';
        updateCounter();

        // Switch to chat view if on home or another view
        app.dataset.view = 'chat';
        app.querySelectorAll('.nav-item').forEach(btn => {
          const isActive = btn.dataset.view === 'chat';
          btn.classList.toggle('active', isActive);
          if (isActive) btn.setAttribute('aria-current', 'page');
          else btn.removeAttribute('aria-current');
        });

        scrollToLatest(true);
        emit({type: 'query', text, attachment: att});
      };

      form.addEventListener('submit', submit);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          submit(event);
        }
      });
    }

    if (attachBtn && fileInput) {
      attachBtn.addEventListener('click', e => {
        e.preventDefault();
        if (!busy) fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        if (file.size > 15 * 1024 * 1024) {
          toast('Tệp đính kèm vượt quá giới hạn 15MB. Vui lòng chọn tệp nhỏ hơn.');
          fileInput.value = '';
          return;
        }

        const nameLower = file.name.toLowerCase();
        const allowed = ['.pdf', '.docx', '.txt'];
        if (!allowed.some(ext => nameLower.endsWith(ext))) {
          toast(nameLower.endsWith('.doc')
            ? 'Tệp Word định dạng cũ (.doc) chưa được hỗ trợ. Vui lòng lưu lại dưới dạng .docx hoặc .pdf.'
            : 'Chỉ hỗ trợ tệp văn bản .PDF, .DOCX hoặc .TXT');
          fileInput.value = '';
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          formAttachment = {
            name: file.name,
            size: file.size,
            type: file.type || 'application/octet-stream',
            data: reader.result,
          };
          if (previewName) previewName.textContent = file.name;
          if (previewSize) previewSize.textContent = formatBytes(file.size);
          if (bar) bar.style.display = 'block';
          toast('Đã đính kèm: ' + file.name);
          if (input) input.focus();
        };
        reader.onerror = () => {
          toast('Không thể đọc tệp đã chọn. Vui lòng thử lại.');
        };
        reader.readAsDataURL(file);
      });
    }

    if (previewRemove) {
      previewRemove.addEventListener('click', e => {
        e.preventDefault();
        formAttachment = null;
        if (fileInput) fileInput.value = '';
        if (bar) bar.style.display = 'none';
      });
    }
  });

  const dialog = app.querySelector('.info-dialog');
  const showDialog = (title, markup) => {
    dialog.querySelector('h2').textContent = title;
    dialog.querySelector('.dialog-body').innerHTML = markup;
    dialog.showModal();
  };
  const dialogs = {
    guide:['Hướng dẫn sử dụng','<p>Nhập câu hỏi về luật lao động hoặc tải lên hợp đồng (.pdf, .docx, .txt) rồi bấm <strong>Gửi câu hỏi</strong>. Enter để gửi, Shift + Enter để xuống dòng.</p><p>Bạn cũng có thể chọn câu hỏi gợi ý. Nếu trợ lý cần thêm dữ kiện, chọn câu trả lời phù hợp hoặc nhập thông tin bổ sung.</p><p>Mở <strong>Căn cứ pháp lý</strong> để xem điều khoản và nguồn văn bản. Trong trang Trợ lý AI, mở <strong>Lịch sử</strong> để tiếp tục trò chuyện.</p>'],
    attachment:['Đính kèm văn bản','<p>Trợ lý hỗ trợ đọc trực tiếp các tệp hợp đồng, quyết định, thỏa thuận dạng <strong>.PDF, .DOCX hoặc .TXT</strong> (tối đa 15MB). PDF dạng ảnh scan được nhận dạng bằng OCR (tối đa 10 trang).</p><p>Bấm vào nút <strong>Đính kèm văn bản</strong> (biểu tượng kẹp giấy) tại ô nhập liệu để tải tệp lên đối chiếu và rà soát pháp luật.</p>'],
    policy:['Chính sách sử dụng','<p>VietLabor AI hỗ trợ tra cứu thông tin pháp luật lao động từ các văn bản trong cơ sở dữ liệu. Nội dung cung cấp mang tính tham khảo và không thay thế ý kiến tư vấn chuyên môn cho tình huống pháp lý cụ thể.</p>'],
    terms:['Điều khoản','<p>VietLabor AI hỗ trợ tra cứu thông tin pháp luật lao động từ các văn bản trong cơ sở dữ liệu. Nội dung cung cấp mang tính tham khảo và không thay thế ý kiến tư vấn chuyên môn cho tình huống pháp lý cụ thể.</p>'],
    contact:['Liên hệ','<p>Thông tin liên hệ chưa được cấu hình.</p><p>Bạn có thể gửi góp ý qua mục <strong>Phản hồi</strong> của ứng dụng.</p>'],
    feedback:['Phản hồi','<form class="feedback-form"><label for="vl-feedback">Góp ý về giao diện hoặc câu trả lời</label><textarea id="vl-feedback" required maxlength="1000" placeholder="Nhập góp ý của bạn..."></textarea><button class="send" type="submit">Gửi phản hồi</button></form>'],
  };
  const escapeHtml = value => String(value || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  // Builds a printable consultation document from the already-rendered (and
  // server-escaped) answer. Only the user's question is raw text, so it is
  // escaped here.
  const exportAnswer = messageId => {
    const article = app.querySelector(`[data-export="${CSS.escape(messageId)}"]`)?.closest('.assistant-message');
    if (!article) return;
    const index = data.messages.findIndex(msg => msg.id === messageId);
    const question = index > 0
      ? [...data.messages.slice(0, index)].reverse().find(msg => msg.role === 'user')?.content || ''
      : '';
    const answerHtml = article.querySelector('.answer-markdown')?.innerHTML || '';
    const coverage = article.querySelector('.coverage')?.outerHTML || '';
    const citations = [...article.querySelectorAll('.citation')].map(card => {
      const title = card.querySelector('summary strong')?.textContent || '';
      const badge = card.querySelector('summary small')?.textContent || '';
      const heading = card.querySelector('div > p')?.textContent || '';
      const excerpt = card.querySelector('blockquote')?.textContent || '';
      const link = card.querySelector('.citation-links a')?.getAttribute('href') || '';
      return `<li><strong>${escapeHtml(title)}</strong> — ${escapeHtml(badge)}`
        + (heading ? `<div class="heading">${escapeHtml(heading)}</div>` : '')
        + (excerpt ? `<blockquote>${escapeHtml(excerpt)}</blockquote>` : '')
        + (link ? `<div class="link">Nguồn: ${escapeHtml(link)}</div>` : '')
        + '</li>';
    }).join('');
    const stamp = new Date().toLocaleString('vi-VN');
    const doc = `<!doctype html><html lang="vi"><head><meta charset="utf-8">
<title>Bản tư vấn pháp luật lao động - VietLabor AI</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body { font: 12.5pt/1.55 "Times New Roman", Georgia, serif; color: #1d1d27; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  header { border-bottom: 3px solid #A5121B; padding-bottom: 10px; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 20pt; color: #A5121B; }
  header .meta { font-size: 10pt; color: #6b5f52; margin-top: 4px; }
  h2 { font-size: 13.5pt; color: #A5121B; border-bottom: 1px solid #e7d9c4; padding-bottom: 4px; margin-top: 22px; }
  .question { background: #faf6ee; border-left: 4px solid #D6A43B; padding: 10px 14px; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; } td, th { border: 1px solid #d9c9b0; padding: 4px 8px; }
  ol.citations li { margin-bottom: 10px; } .heading { font-style: italic; }
  blockquote { margin: 6px 0 0; padding: 6px 12px; background: #f7f4ee; border-left: 3px solid #cbb89b; font-size: 11pt; }
  .link { font-size: 9.5pt; color: #6b5f52; word-break: break-all; }
  footer { margin-top: 28px; padding-top: 10px; border-top: 1px solid #e7d9c4; font-size: 9.5pt; color: #6b5f52; }
</style></head><body>
<header><h1>BẢN TƯ VẤN PHÁP LUẬT LAO ĐỘNG</h1><div class="meta">VietLabor AI — Trợ lý tra cứu pháp luật lao động Việt Nam • Xuất lúc ${escapeHtml(stamp)}</div></header>
${question ? `<h2>Câu hỏi / tình huống</h2><div class="question">${escapeHtml(question)}</div>` : ''}
<h2>Nội dung tư vấn</h2>${answerHtml}${coverage}
${citations ? `<h2>Căn cứ pháp lý</h2><ol class="citations">${citations}</ol>` : ''}
<footer>Nội dung do hệ thống AI tổng hợp từ văn bản pháp luật trong cơ sở dữ liệu, chỉ mang tính tham khảo và không thay thế ý kiến tư vấn của luật sư hoặc cơ quan nhà nước có thẩm quyền. Luôn đối chiếu với văn bản pháp luật gốc.</footer>
</body></html>`;
    const win = window.open('', '_blank');
    if (win) {
      win.document.open();
      win.document.write(doc);
      win.document.close();
      win.focus();
      setTimeout(() => win.print(), 300);
      toast('Chọn "Lưu dưới dạng PDF" trong hộp thoại in để tải bản tư vấn.');
    } else {
      // Popup blocked: download the same document as an HTML file instead.
      const url = URL.createObjectURL(new Blob([doc], {type: 'text/html;charset=utf-8'}));
      const link = document.createElement('a');
      link.href = url;
      link.download = `ban-tu-van-vietlabor-${Date.now()}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Trình duyệt chặn cửa sổ in, đã tải bản tư vấn dạng HTML.');
    }
  };
  const onClick = async event => {
    const button = event.target.closest('button');
    if (!button || !app.contains(button)) return;
    if (button.hasAttribute('data-auth-open')) openAuth(button.dataset.authOpen);
    else if (button.hasAttribute('data-auth-mode')) setAuthMode(button.dataset.authMode);
    else if (button.hasAttribute('data-auth-close')) closeAuth();
    else if (button.hasAttribute('data-auth-password')) {
      const field = authDialog?.querySelector('[name="password"]');
      if (field) {
        const reveal = field.type === 'password';
        field.type = reveal ? 'text' : 'password';
        button.textContent = reveal ? 'Ẩn' : 'Hiện';
        button.setAttribute('aria-label', reveal ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      }
    }
    else if (button.hasAttribute('data-view')) {
      const targetView = button.dataset.view;
      app.dataset.view = targetView;
      app.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.dataset.view === targetView;
        btn.classList.toggle('active', isActive);
        if (isActive) btn.setAttribute('aria-current', 'page');
        else btn.removeAttribute('aria-current');
      });
      emit({type:'navigate', view:targetView});
    }
    else if (button.hasAttribute('data-query')) {
      app.dataset.view = 'chat';
      app.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.dataset.view === 'chat';
        btn.classList.toggle('active', isActive);
        if (isActive) btn.setAttribute('aria-current', 'page');
        else btn.removeAttribute('aria-current');
      });
      scrollToLatest(true);
      emit({type:'query', text:button.dataset.query});
    }
    else if (button.hasAttribute('data-event')) {
      if (button.dataset.event === 'new_chat') {
        app.dataset.view = 'chat';
        app.querySelectorAll('.sidebar-conv-row').forEach(row => row.classList.remove('active'));
      }
      emit({type:button.dataset.event});
    }
    else if (button.hasAttribute('data-conversation')) {
      const targetConv = button.dataset.conversation;
      app.querySelectorAll('.sidebar-conv-row').forEach(row => {
        const hasBtn = row.querySelector(`[data-conversation="${targetConv}"]`);
        row.classList.toggle('active', Boolean(hasBtn));
      });
      app.dataset.view = 'chat';
      setTimeout(() => scrollToLatest(false), 50);
      emit({type:'switch', id:targetConv});
    }
    else if (button.hasAttribute('data-delete')) {
      event.preventDefault();
      event.stopPropagation();
      const deleteId = button.dataset.delete;
      if (deleteId === 'all') {
        if (!window.confirm('Bạn có chắc chắn muốn xóa toàn bộ lịch sử trò chuyện không?')) {
          return;
        }
      }
      const row = button.closest('.sidebar-conv-row');
      if (row) {
        row.style.opacity = '0.35';
        row.style.pointerEvents = 'none';
      }
      emit({type:'delete', id:deleteId});
    }
    else if (button.hasAttribute('data-feedback')) emit({type:'feedback', rating:button.dataset.feedback, id:button.dataset.message});
    else if (button.hasAttribute('data-mobile-menu')) app.classList.toggle('menu-open');
    else if (button.classList.contains('dialog-close')) {
      dialog.close();
      dialog.classList.remove('template-dialog-view');
    }
    else if (button.hasAttribute('data-template')) {
      const templateId = button.dataset.template;
      const templatesScript = app.querySelector('#vl-templates-data');
      if (templatesScript) {
        try {
          const templates = JSON.parse(templatesScript.textContent);
          const item = templates.find(t => t.id === templateId);
          if (item) {
            const safeContent = item.content
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
            const modalMarkup = `
              <div class="template-modal-body">
                <div class="template-modal-meta">
                  <span class="template-modal-tag">${item.tag}</span>
                  <span class="template-modal-basis">${item.basis}</span>
                </div>
                <p class="template-modal-desc">${item.summary}</p>
                <div class="template-modal-toolbar">
                  <button class="btn-copy-template" data-tpl-copy="${item.id}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7.242a2 2 0 0 0-.602-1.43L16.083 2.57A2 2 0 0 0 14.685 2H10a2 2 0 0 0-2 2z"/><path d="M16 18v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2"/></svg>
                    <span>Sao chép toàn bộ mẫu</span>
                  </button>
                  <button class="btn-ai-fill" data-query="${item.query.replace(/"/g, '&quot;')}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    <span>Nhờ AI điền thông tin</span>
                  </button>
                </div>
                <div class="template-pre-wrapper">
                  <pre class="template-pre">${safeContent}</pre>
                </div>
              </div>
            `;
            dialog.classList.add('template-dialog-view');
            showDialog(item.title, modalMarkup);
          }
        } catch (e) {
          console.error(e);
        }
      }
    }
    else if (button.hasAttribute('data-tpl-copy')) {
      const pre = dialog.querySelector('.template-pre');
      if (pre) {
        try {
          await navigator.clipboard.writeText(pre.textContent);
          toast('Đã sao chép toàn bộ mẫu văn bản vào bộ nhớ tạm!');
        } catch (_) {
          const range = document.createRange();
          range.selectNodeContents(pre);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          toast('Đã bôi đen toàn bộ mẫu. Nhấn Ctrl+C để sao chép.');
        }
      }
    }
    else if (button.classList.contains('btn-ai-fill')) {
      dialog.close();
      dialog.classList.remove('template-dialog-view');
      app.dataset.view = 'chat';
      app.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.dataset.view === 'chat';
        btn.classList.toggle('active', isActive);
        if (isActive) btn.setAttribute('aria-current', 'page');
        else btn.removeAttribute('aria-current');
      });
      scrollToLatest(true);
      emit({type:'query', text:button.dataset.query});
    }
    else if (button.hasAttribute('data-copy')) {
      const message = data.messages.find(msg => msg.id === button.dataset.copy);
      if (message) {
        try { await navigator.clipboard.writeText(message.content); toast('Đã sao chép câu trả lời.'); }
        catch (_) { toast('Trình duyệt chưa cho phép sao chép. Bạn có thể chọn nội dung và sao chép trực tiếp.'); }
      }
    } else if (button.hasAttribute('data-export')) {
      exportAnswer(button.dataset.export);
    } else if (button.hasAttribute('data-dialog')) {
      const key = button.dataset.dialog;
      if (key === 'history') showDialog('Lịch sử trò chuyện', app.querySelector('#history-content').innerHTML);
      else if (dialogs[key]) showDialog(...dialogs[key]);
    }
  };
  if (app) app.addEventListener('click', onClick);
  if (dialog) {
    dialog.addEventListener('click', event => {
      if (event.target === dialog) {
        dialog.close();
        dialog.classList.remove('template-dialog-view');
      }
    });
    dialog.addEventListener('submit', event => {
      if (!event.target.classList.contains('feedback-form')) return;
      event.preventDefault();
      const text = dialog.querySelector('#vl-feedback')?.value?.trim();
      if (text) emit({type:'general_feedback', text});
    });
  }
  const search = app.querySelector('#document-search');
  if (search) search.addEventListener('input', () => {
    const query = search.value.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
    let visible = 0;
    app.querySelectorAll('.searchable-documents .document-row').forEach(row => {
      const title = row.textContent.toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
      row.hidden = !title.includes(query);
      if (!row.hidden) visible++;
    });
    const noRes = app.querySelector('.no-results');
    if (noRes) noRes.hidden = visible > 0;
  });
  if (data.notice) toast(data.notice);
  return () => {
    try {
      if (app) app.removeEventListener('click', onClick);
      if (toastTimer) clearTimeout(toastTimer);
      if (thinkingTimer) clearInterval(thinkingTimer);
      if (typeTimer) clearInterval(typeTimer);
      if (authForm) authForm.removeEventListener('submit', onAuthSubmit);
      if (authDialog) {
        authDialog.removeEventListener('click', onAuthBackdrop);
      }
    } catch (_) {}
  };
  } catch (err) {
    console.error('[VietLaborAI] Component error caught in boundary:', err);
    return () => {};
  }
}
